[[mcp_servers]]
name = "filesystem"
transport = "stdio"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/root/demo-app"]
startup_timeout_sec = 15
tool_timeout_sec = 120

[[mcp_servers]]
name = "octopus"
transport = "stdio"
command = "bash"
args = ["-lc", "OCTOPUS_URL='http://localhost:8080' OCTOPUS_API_KEY='API-XXXXXXXXXXXX' node /root/mcp-octopus/index.js"]
startup_timeout_sec = 15
tool_timeout_sec = 120
